name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # zizmor[artipacked]: the checkout's credentials are not needed past this step.
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      # The 39 integration tests are NOT run here and cannot be: they launch a real
      # headless Burp Suite, and hx neither bundles nor redistributes it (see
      # no-burp.yml, which enforces that). `addopts = -m 'not integration'` in
      # pyproject.toml deselects them, so this job is green without them -- which is
      # exactly why it says so here. Run them locally with `pytest -m integration`.
      - name: Tests (unit only — integration needs a real Burp jar, see below)
        run: uv run --frozen pytest -q
      - name: Lint (blocking)
        run: uv run --frozen ruff check .
      # NON-BLOCKING BY DESIGN, and this is not a permanent state. The codebase is
      # largely unannotated, so a strict gate landing with the first CI would have
      # meant a speculative refactor between this repo and its first green build.
      # 22 errors across 12 files at the time this landed; the intent to tighten is
      # recorded in pyproject.toml's [tool.mypy] block, whose "off for now" flags are
      # the checklist. A green tick here means "mypy ran", not "mypy is clean".
      - name: Type check (advisory — tightening tracked in pyproject.toml)
        run: uv run --frozen mypy
        continue-on-error: true
