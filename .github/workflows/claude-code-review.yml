name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Skip bot-authored PRs (Dependabot bumps): the action rejects non-human
    # actors, and reviewing machine-generated lockfile diffs wastes review quota.
    #
    # PUBLIC REPOSITORY. The association gate stops a drive-by fork PR from
    # spending review quota. A `pull_request` event from a fork carries no
    # secrets, so this was never a credential exposure -- it is a cost gate.
    if: >-
      github.actor != 'dependabot[bot]' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked]
        # THE CREDENTIAL IS LOAD-BEARING HERE TOO, and `persist-credentials: false`
        # sat here until 2026-09-01 on the grounds that "findings are posted through
        # the GitHub API rather than git, so the checkout's credential has no
        # consumer". True of the findings; false of the checkout. The action checks
        # out the PR branch ITSELF -- `git fetch origin --depth=<commits in the PR>`
        # -- and with credentials stripped the remote carries no auth, so git asks
        # for a username on a machine with no tty:
        #
        #   fatal: could not read Username for 'https://github.com': No such device
        #   Action failed with error: Command failed: git fetch origin --depth=28 ...
        #
        # IT FAILED THAT WAY ON EVERY RUN THAT REACHED IT, and the greens hid it: a
        # PR that edits this file makes the action self-skip (see the note below),
        # and self-skip is reported as success. Every green run in this workflow's
        # history was a skip; every run that actually started, failed. `claude.yml`
        # has always carried the credential and has always worked -- this is that
        # same shape, with the reason it needs one written down rather than assumed.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # A PR THAT EDITS THIS FILE GETS NO REVIEW, AND THE CHECK STILL SHOWS GREEN.
      #
      # claude-code-action validates that this workflow file is byte-identical to the
      # copy on the default branch, and self-skips when it is not:
      #
      #   Skipping action due to workflow validation: Workflow validation failed. The
      #   workflow file must exist and have identical content to the version on the
      #   repository's default branch.
      #
      # The guard is correct — otherwise a PR could rewrite the reviewer's own
      # instructions and have it approve anything. But the skip is a *success*: the job
      # completes green in ~20s having reviewed nothing, which is indistinguishable from
      # a clean review at a glance.
      #
      # So: when a PR touches this workflow, check the job duration (a real review takes
      # 2-3 minutes) before trusting the green tick, and re-verify the change once it has
      # landed on the default branch.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post + maintain a managed PR comment with the review (the switch that makes
          # this behave like the working @claude responder). Without it the PR-review
          # path relies on the agent explicitly calling a post tool and stays silent.
          track_progress: true
          # Direct review prompt (no code-review plugin). The plugin's slash-command
          # run was sandboxed in CI (heavy tool-permission denials, no comments posted);
          # the plain-prompt mode — the same one the @claude responder uses successfully —
          # gets the tool access it needs to read the diff and post findings.
          # THIS PROMPT DESCRIBED A DIFFERENT PROJECT UNTIL 2026-09-01. These
          # workflows were copied wholesale from ubercylon8/f0_sectools, which
          # was the point -- the CI was meant to match it -- and the review
          # prompt came with them, still naming f0_sectools' architecture and
          # its CLAUDE.md rules. hx has no MCP servers, no agentskills.io
          # skills and no core/gating, so every review since was grounded in
          # invariants this repo does not have. Copying a workflow is safe;
          # copying a PROMPT carries the other project's model of the world.
          prompt: |
            Do a security-focused code review of PR #${{ github.event.pull_request.number }}
            in ${{ github.repository }}. hx is an agent-driven web application
            security assessment harness that drives Burp Suite Community as an
            engine. It runs against real client estates, so a defect here reaches
            somebody's production application.
            Ground the review in docs/DECISIONS.md and the master spec at
            docs/superpowers/specs/2026-08-21-hx-design.md:
            - EVERY BYTE that leaves this machine crosses one of two enforcement
              points inside the JVM (spec section 4). Scope, rate, budget,
              dangerous-path, method allowlist and credential redaction live in
              the Java extension. Python must never gain an egress path or a
              second place that decides any of them.
            - DENY-ALL is the default and a halt is terminal. A change that makes
              an unconfigured extension send, or a halt liftable from Python, is
              the most serious thing you can find.
            - A report that cannot distinguish "tested, clean" from "never
              reached" is worse than no report (section 12). Anything that
              collapses those two -- an outcome, a verdict, a count, a coverage
              claim -- is a finding.
            - A credential value never appears in config.yaml, in a rendered
              report, in agent_action, or in any log or exception message.
            - The agent may never write finding status confirmed or reported, and
              the tool registry is an allowlist: what is not in it has no path.
            - Engagement directories stay 0700 and blobs and the database 0600.
            - hx never bundles or redistributes Burp.
            - Correctness and test coverage of the changed logic -- and in
              particular, A TEST THAT WOULD PASS WITH THE BUG PRESENT. This repo
              has shipped several: a cap asserted against a value that never
              reached it, a listing test asserting the opposite of its comment,
              a wiring test blind to the argument it existed to check. Prefer
              probing behaviour over reading assertions.
            Post findings as PR comments — a concise top-level summary plus inline comments
            where a specific line is at fault. If nothing significant, say so briefly.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md

